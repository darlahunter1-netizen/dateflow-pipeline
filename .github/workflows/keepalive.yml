name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity:
# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/disable-and-enable-workflows
#
# This monthly heartbeat is a real commit, so the schedule in
# daily-reel.yml keeps running. It changes one timestamp file and nothing else.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record a heartbeat
        run: |
          set -euo pipefail
          mkdir -p .github
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --staged --quiet; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git commit -m "chore: keepalive heartbeat [skip ci]"
          git push
