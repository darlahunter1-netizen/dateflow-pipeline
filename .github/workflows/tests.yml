name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml requests

      - name: Compile Python
        run: python -m py_compile pipeline.py

      - name: Check shell syntax
        run: bash -n setup_buffer.sh

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Dry-run smoke test (no network, no publish)
        run: python pipeline.py --mode dry_run --offline --no-llm --max-posts 1
